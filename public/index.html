<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same Brain?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: one phone-width column of sticker-like cards on a sunny field; the radar is the loud part. */
  --sun: #FFC93C;
  --paper: #FFF8E4;
  --ink: #1D1A3A;
  --coral: #FF5D5D;
  --mint: #2FCFA8;
  --sky: #6C8CFF;
  --muted: #5d597a;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Onest", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--sun); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
#app { max-width: 460px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: 56px; letter-spacing: -0.5px; }
h1 .q { color: var(--coral); display: inline-block; transform: rotate(8deg); }
h2 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { font-family: var(--body); font-weight: 800; font-size: 16px; background: var(--coral); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 18px; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { background: #d9d3c0; color: var(--muted); cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
.btn.mint { background: var(--mint); }
.btn.sky { background: var(--sky); }
.btn.plain { background: var(--paper); }
.btn.small { font-size: 14px; padding: 7px 12px; border-radius: 11px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
.btn.wide { width: 100%; }
.link { background: none; border: 0; padding: 4px; text-decoration: underline; font-size: 14px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.blob { --c: var(--sky); flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--c); border: 3px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
.blob.big { width: 64px; height: 64px; font-size: 32px; }
.name { font-weight: 800; overflow-wrap: anywhere; }
.pts { font-variant-numeric: tabular-nums; font-weight: 800; }

/* welcome */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; }
.steps li::before { content: counter(s); font-family: var(--display); font-size: 22px; color: var(--coral); width: 18px; flex: none; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--coral); flex: none; margin: 0; }
.err { background: #ffe1dc; border: 2px solid var(--coral); border-radius: 12px; padding: 10px 12px; font-size: 14px; }

/* radar */
.radar { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); border: 3px solid var(--ink); overflow: hidden;
  background-image: radial-gradient(circle, transparent 0 24.5%, #ffffff2e 24.5% 25%, transparent 25% 49.5%, #ffffff2e 49.5% 50%, transparent 50% 74.5%, #ffffff2e 74.5% 75%, transparent 75%); }
.radar .sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #ffc93c00 0deg, #ffc93c00 300deg, #ffc93c88 360deg); animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.radar .me, .radar .dot { position: absolute; transform: translate(-50%, -50%); }
.radar .me { left: 50%; top: 50%; width: 52px; height: 52px; font-size: 26px; box-shadow: 0 0 0 6px #ffffff2e; }
.radar .dot { padding: 0; border-width: 3px; animation: pop .35s ease-out both; }
.radar .dot.busy { opacity: .55; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.3); } }
.radar .empty { position: absolute; left: 0; right: 0; bottom: 16%; text-align: center; color: #fff; font-size: 14px; padding: 0 22%; }
input[type=range] { width: 100%; accent-color: var(--coral); height: 28px; margin: 0; }
.list { display: flex; flex-direction: column; gap: 10px; }
.more { display: flex; gap: 8px; padding-left: 54px; }
.board { display: flex; flex-direction: column; gap: 6px; }
.board .row { padding: 6px 8px; border-radius: 12px; }
.board .row.me { background: var(--sun); }
.board .rank { font-family: var(--display); width: 22px; text-align: center; }
.board .blob { width: 32px; height: 32px; font-size: 16px; border-width: 2px; }

/* duel */
.versus { justify-content: space-between; }
.versus .side { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 42%; text-align: center; font-size: 14px; }
.versus .vs { font-family: var(--display); font-size: 24px; color: var(--coral); }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
.dots i.hit { background: var(--mint); }
.dots i.miss { background: var(--coral); }
.dots i.now { box-shadow: 0 0 0 4px #1d1a3a33; }
.tbar { height: 12px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper); overflow: hidden; }
.tbar b { display: block; height: 100%; width: 100%; background: var(--coral); }
.qtext { font-family: var(--display); font-size: 28px; line-height: 1.1; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 13px 14px; font-weight: 600; box-shadow: 3px 3px 0 var(--ink); display: flex; align-items: center; gap: 8px; }
.opt span.t { flex: 1; }
.opt.sel { background: var(--sky); }
.opt.both { background: var(--mint); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .tag { font-size: 12px; font-weight: 800; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 2px 7px; white-space: nowrap; }
.banner { font-family: var(--display); font-size: 22px; text-align: center; padding: 8px; border-radius: 12px; border: 3px solid var(--ink); }
.banner.hit { background: var(--mint); }
.banner.miss { background: var(--coral); }
.pct { font-family: var(--display); font-size: 96px; line-height: .9; text-align: center; color: var(--coral); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.center { text-align: center; }
.reacts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.bubble { max-width: 80%; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 14px; font-weight: 600; font-size: 15px; background: #fff; align-self: flex-start; }
.bubble.mine { align-self: flex-end; background: var(--sky); }

/* overlay + toast */
.overlay { position: fixed; inset: 0; background: #1d1a3acc; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay .card { width: 100%; max-width: 380px; align-items: center; text-align: center; }
#toasts { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 20; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; max-width: 420px; }
@media (max-width: 380px) { h1 { font-size: 46px; } .qtext { font-size: 24px; } .pct { font-size: 78px; } }
@media (prefers-reduced-motion: reduce) { .radar .sweep, .radar .dot { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="overlay"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var overlayEl = document.getElementById('overlay');
  var toastsEl = document.getElementById('toasts');
  var DEMO = /[?&]demo/.test(location.search);
  var REACT = { gg: '🤝 Good game!', ha: '😂 Hahaha', twin: '👯 Are we twins?!', how: '🤨 How did you pick THAT?', again: '🔁 One more round?', bye: '👋 Bye, neighbour!' };

  var me = null;          // {id, token}
  var coords = null;      // {lat, lng}
  var S = null;           // latest state from the server
  var es = null;
  var lastSig = '';
  var holding = false;    // true while the radius slider is being dragged
  var openMore = null;    // id of the player row whose block/report buttons are open
  var clock = { key: '', end: 0, total: 1 };
  var welcomeError = '';
  var busyJoin = false;

  // Demo mode keeps each tab separate, so two tabs on one computer act as two players.
  function store(k, v) { try { var box = DEMO ? sessionStorage : localStorage; if (v === undefined) return JSON.parse(box.getItem(k)); box.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function blob(p, cls) { return '<span class="blob ' + (cls || '') + '" style="--c:' + esc(p.color) + '">' + esc(p.emoji) + '</span>'; }
  function toast(text) {
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = text;
    toastsEl.appendChild(d); setTimeout(function () { d.remove(); }, 3500);
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, data: j }; }); });
  }
  function act(type, extra) {
    var body = Object.assign({ id: me.id, token: me.token, type: type }, extra || {});
    return post('/api/act', body).then(function (r) {
      if (r.status === 401) return join();
      if (!r.ok && r.data && r.data.error) toast(r.data.error);
    }).catch(function () { toast('No connection. Check your internet.'); });
  }

  // ---------- joining ----------
  function locate() {
    return new Promise(function (resolve, reject) {
      if (DEMO) return resolve({ lat: 33.8938 + (Math.random() - 0.5) * 0.04, lng: 35.5018 + (Math.random() - 0.5) * 0.04 });
      if (!navigator.geolocation) return reject(new Error('This browser cannot share a location.'));
      navigator.geolocation.getCurrentPosition(
        function (pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        function (e) {
          reject(new Error(e.code === 1
            ? 'Location is blocked. Allow it for this site in your browser settings, then try again.'
            : 'Could not get your location. Check that location is switched on, then try again.'));
        },
        { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 });
    });
  }
  function join() {
    var saved = me || store('sb_player') || {};
    return post('/api/join', { id: saved.id, token: saved.token, lat: coords.lat, lng: coords.lng, radius: store('sb_radius') || 10, adult: true })
      .then(function (r) {
        if (!r.ok) throw new Error((r.data && r.data.error) || 'Could not join.');
        me = r.data; store('sb_player', me); connect();
      });
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/api/events?id=' + encodeURIComponent(me.id) + '&token=' + encodeURIComponent(me.token));
    es.addEventListener('state', function (ev) { S = JSON.parse(ev.data); render(); });
    es.addEventListener('toast', function (ev) { toast(JSON.parse(ev.data).text); });
    es.onerror = function () {
      // The server forgot us (it restarted): join again as a new player.
      if (es.readyState === 2) { es = null; setTimeout(function () { join().catch(function () {}); }, 1500); }
    };
  }
  function start() {
    if (busyJoin) return;
    busyJoin = true; welcomeError = ''; renderWelcome();
    locate().then(function (c) { coords = c; return join(); })
      .then(function () { store('sb_ok', true); busyJoin = false; })
      .catch(function (e) { busyJoin = false; welcomeError = e.message; renderWelcome(); });
  }

  // ---------- screens ----------
  function renderWelcome() {
    var ok = !!store('sb_ok');
    app.innerHTML =
      '<header><h1>Same Brain<span class="q">?</span></h1></header>' +
      '<p style="font-size:19px;font-weight:600">Five silly questions. One stranger nearby. Find out how alike you think.</p>' +
      '<div class="card"><ol class="steps">' +
      '<li><span>You get a funny nickname. No sign up, no real name.</span></li>' +
      '<li><span>Your radar shows players around you and roughly how far they are.</span></li>' +
      '<li><span>Challenge one. You both answer the same questions and get a match score.</span></li>' +
      '</ol></div>' +
      '<div class="card">' +
      '<label class="check" for="adult"><input type="checkbox" id="adult"' + (ok ? ' checked' : '') + '><span>I am 18 or older, and I will play nicely.</span></label>' +
      (welcomeError ? '<div class="err" role="alert">' + esc(welcomeError) + '</div>' : '') +
      '<button class="btn wide" id="go"' + (busyJoin ? ' disabled' : '') + '>' + (busyJoin ? 'Finding you…' : 'Find players near me') + '</button>' +
      '<p class="muted">Your browser will ask for your location. Other players only ever see your nickname and a rough distance, never where you are.' +
      (DEMO ? ' <b>Demo mode: using a pretend location in Beirut.</b>' : '') + '</p>' +
      '</div>';
    document.getElementById('go').onclick = function () {
      if (!document.getElementById('adult').checked) { welcomeError = 'Tick the box first to confirm you are 18 or older.'; return renderWelcome(); }
      start();
    };
  }

  function homeHTML() {
    var m = S.me, n = S.nearby, h = '';
    h += '<header class="row"><h2 class="grow" style="font-size:28px">Same Brain<span style="color:var(--coral)">?</span></h2>' +
      blob(m) + '<div><div class="name">' + esc(m.name) + '</div><div class="muted pts">' + m.points + ' pts</div></div></header>';

    h += '<section class="card"><div class="radar"><div class="sweep"></div>';
    n.forEach(function (p) {
      var r = [14, 24, 34, 43][p.ring - 1], a = p.angle * Math.PI / 180;
      h += '<button class="blob dot' + (p.busy ? ' busy' : '') + '" data-ch="' + esc(p.id) + '" title="' + esc(p.name) + ', ' + esc(p.dist) + '" aria-label="Challenge ' + esc(p.name) + '" style="--c:' + esc(p.color) +
        ';left:' + (50 + Math.cos(a) * r).toFixed(1) + '%;top:' + (50 + Math.sin(a) * r).toFixed(1) + '%">' + esc(p.emoji) + '</button>';
    });
    h += blob(m, 'me');
    if (!n.length) h += '<div class="empty">Nobody in range yet. Widen your radius or warm up against a bot.</div>';
    h += '</div>' +
      '<div><div class="row"><label for="radius" class="grow name">Radius</label><span class="pts" id="rlabel">' + m.radius + ' km</span></div>' +
      '<input type="range" id="radius" min="1" max="50" step="1" value="' + m.radius + '">' +
      '<p class="muted">' + n.length + (n.length === 1 ? ' player' : ' players') + ' in range. People only see you if you are inside their radius too.</p></div></section>';

    h += '<section class="card"><h2>Nearby players</h2><div class="list">';
    if (!n.length) h += '<p class="muted">Quiet around here. Send the link to a friend nearby, or practise now.</p>';
    n.forEach(function (p) {
      var waiting = S.outgoing && S.outgoing.id === p.id;
      h += '<div class="row">' + blob(p) + '<div class="grow"><div class="name">' + esc(p.name) + '</div><div class="muted">' + esc(p.dist) + ' · ' + p.points + ' pts</div></div>' +
        (waiting ? '<button class="btn small plain" data-cancel="1">Waiting… cancel</button>'
          : p.busy ? '<button class="btn small" disabled>In a game</button>'
          : '<button class="btn small" data-ch="' + esc(p.id) + '"' + (S.outgoing ? ' disabled' : '') + '>Challenge</button>') +
        '<button class="link" data-more="' + esc(p.id) + '" aria-label="More options for ' + esc(p.name) + '">⋯</button></div>';
      if (openMore === p.id) {
        h += '<div class="more"><button class="btn small plain" data-block="' + esc(p.id) + '">Block</button><button class="btn small plain" data-report="' + esc(p.id) + '">Report and block</button></div>';
      }
    });
    h += '</div><button class="btn sky wide" data-bot="1">Practise against a bot</button>' +
      '<p class="muted">Bot rounds are for fun and do not count on the leaderboard.</p></section>';

    h += '<section class="card"><h2>Top brains within ' + m.radius + ' km</h2><div class="board">';
    S.board.forEach(function (b, i) {
      h += '<div class="row' + (b.me ? ' me' : '') + '"><span class="rank">' + (i + 1) + '</span>' + blob(b) +
        '<span class="grow name">' + esc(b.name) + (b.me ? ' (you)' : '') + '</span><span class="pts">' + b.points + '</span></div>';
    });
    h += '</div><p class="muted">A finished game gives both players 10 points, plus 10 for every matching answer.</p></section>';
    return h;
  }

  function duelHTML() {
    var d = S.duel, m = S.me, o = d.opp, h = '';
    h += '<div class="row versus"><div class="side">' + blob(m, 'big') + '<span class="name">You</span></div><span class="vs">vs</span>' +
      '<div class="side">' + blob(o, 'big') + '<span class="name">' + esc(o.name) + (o.bot ? ' (bot)' : '') + '</span></div></div>';
    h += '<div class="dots" aria-label="Progress">';
    for (var i = 0; i < d.total; i++) {
      h += '<i class="' + (i < d.marks.length ? (d.marks[i] ? 'hit' : 'miss') : (d.phase === 'q' && i === d.idx ? 'now' : '')) + '"></i>';
    }
    h += '</div>';

    if (d.phase !== 'done') {
      h += '<div class="tbar"><b id="tbar"></b></div>';
      h += '<section class="card"><p class="muted">Question ' + (d.idx + 1) + ' of ' + d.total + '</p><div class="qtext">' + esc(d.q.text) + '</div><div class="opts">';
      d.q.options.forEach(function (t, k) {
        var mine = d.mine === k, theirs = d.phase === 'r' && d.theirs === k;
        var cls = mine && theirs ? ' both' : mine ? ' sel' : '';
        var dis = d.phase === 'r' || d.mine !== null;
        h += '<button class="opt' + cls + '" data-ans="' + k + '"' + (dis ? ' disabled' : '') + '><span class="t">' + esc(t) + '</span>' +
          (mine ? '<span class="tag">You</span>' : '') + (theirs ? '<span class="tag">' + esc(o.emoji) + ' ' + esc(o.name) + '</span>' : '') + '</button>';
      });
      h += '</div>';
      if (d.phase === 'r') {
        var hit = d.marks[d.marks.length - 1];
        h += '<div class="banner ' + (hit ? 'hit' : 'miss') + '">' + (hit ? 'Same brain!' : (d.mine === null || d.theirs === null ? 'Too slow!' : 'Different planets.')) + '</div>';
      } else {
        h += '<p class="muted center">' + (d.mine === null
          ? (d.oppAnswered ? esc(o.name) + ' has answered. Your turn!' : 'Pick the one that is most you.')
          : 'Locked in. Waiting for ' + esc(o.name) + '…') + '</p>';
      }
      h += '</section><button class="link" data-leave="1">Quit this game</button>';
    } else {
      var f = d.final;
      h += '<section class="card"><div class="pct">' + f.pct + '%</div><h2 class="center">' + esc(f.verdict) + '</h2>' +
        '<p class="muted center">' + f.matches + ' of ' + d.total + ' answers matched' + (f.points ? ' · +' + f.points + ' points each' : ' · practice round, no points') + '</p></section>';
      h += '<section class="card"><h2>Say something</h2>';
      if (d.reactions.length) {
        h += '<div class="feed">';
        d.reactions.forEach(function (r) { h += '<div class="bubble' + (r.mine ? ' mine' : '') + '">' + esc(REACT[r.key] || '') + '</div>'; });
        h += '</div>';
      }
      h += '<div class="reacts">';
      Object.keys(REACT).forEach(function (k) { h += '<button class="btn small plain" data-react="' + k + '"' + (d.oppLeft ? ' disabled' : '') + '>' + esc(REACT[k]) + '</button>'; });
      h += '</div><p class="muted center">Ready-made messages only. Nobody can send you free text.</p></section>';
      h += '<div class="row wrap">' +
        '<button class="btn mint grow" data-rematch="1"' + (d.oppLeft || d.rematch.me ? ' disabled' : '') + '>' +
        (d.oppLeft ? esc(o.name) + ' left' : d.rematch.me ? 'Waiting for ' + esc(o.name) + '…' : d.rematch.them ? esc(o.name) + ' wants a rematch. Go!' : 'Rematch') + '</button>' +
        '<button class="btn plain grow" data-leave="1">Back to radar</button></div>';
      if (!o.bot) h += '<div class="row wrap" style="justify-content:center"><button class="link" data-block="' + esc(o.id) + '">Block ' + esc(o.name) + '</button><button class="link" data-report="' + esc(o.id) + '">Report and block</button></div>';
    }
    return h;
  }

  function renderOverlay() {
    if (S && S.invite && !S.duel) {
      var f = S.invite.from;
      overlayEl.innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-label="Challenge"><div class="card">' + blob(f, 'big') +
        '<h2>' + esc(f.name) + ' challenges you!</h2><p class="muted">Five quick questions. Takes about a minute.</p>' +
        '<div class="row"><button class="btn mint" data-accept="1">Let\'s play</button><button class="btn plain" data-decline="1">Not now</button></div></div></div>';
    } else overlayEl.innerHTML = '';
  }

  function render() {
    if (!S) return;
    var copy = JSON.parse(JSON.stringify(S));
    if (copy.duel) delete copy.duel.msLeft;
    if (copy.invite) delete copy.invite.msLeft;
    var sig = JSON.stringify(copy) + '|' + openMore;
    if (S.duel) {
      var key = S.duel.id + S.duel.phase + S.duel.idx;
      if (key !== clock.key) clock = { key: key, end: performance.now() + S.duel.msLeft, total: S.duel.phase === 'q' ? 15000 : 3500 };
    }
    if (sig === lastSig) return;
    if (holding && !S.duel) return;
    lastSig = sig;
    app.innerHTML = S.duel ? duelHTML() : homeHTML();
    renderOverlay();
    tick();
    var r = document.getElementById('radius');
    if (r) {
      r.oninput = function () { holding = true; document.getElementById('rlabel').textContent = r.value + ' km'; };
      r.onchange = function () { holding = false; store('sb_radius', +r.value); act('radius', { km: +r.value }); };
    }
  }

  function tick() {
    var bar = document.getElementById('tbar');
    if (bar) bar.style.width = Math.max(0, Math.min(100, (clock.end - performance.now()) / clock.total * 100)) + '%';
  }
  setInterval(tick, 100);

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t || !me) return;
    var d = t.dataset;
    if (d.ch) act('challenge', { who: d.ch });
    else if (d.cancel) act('cancel');
    else if (d.bot) act('bot');
    else if (d.ans !== undefined) act('answer', { choice: +d.ans });
    else if (d.react) act('react', { key: d.react });
    else if (d.rematch) act('rematch');
    else if (d.leave) act('leave');
    else if (d.accept) act('respond', { accept: true });
    else if (d.decline) act('respond', { accept: false });
    else if (d.more) { openMore = openMore === d.more ? null : d.more; render(); }
    else if (d.block) { openMore = null; act('block', { who: d.block }).then(function () { toast('Blocked. You will not see each other again.'); }); }
    else if (d.report) { openMore = null; act('report', { who: d.report }).then(function () { toast('Reported and blocked. Thank you.'); }); }
  });

  renderWelcome();
})();
</script>
</body>
</html>
